<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Recorda</title>
<link rel="stylesheet" href="styles.css">
<style>
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:400px; }
  .auth-brand{ display:flex; align-items:center; gap:9px; justify-content:center; margin-bottom:28px; }
  .auth-brand .brand-mark{ width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--display); }
  .auth-brand span{ font-weight:800; font-size:19px; }
  .auth-card h1{ font-size:21px; font-weight:800; text-align:center; margin-bottom:6px; }
  .auth-card p.sub{ text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:26px; }
  .divider-or{ display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--ink-faint); font-size:12.5px; font-weight:600; }
  .divider-or::before, .divider-or::after{ content:""; flex:1; height:1px; background:var(--line); }
  .forgot-link{ font-size:13px; font-weight:700; color:var(--accent); align-self:flex-end; margin-top:-8px; }
  .auth-foot{ text-align:center; margin-top:22px; font-size:14px; color:var(--ink-soft); }
  .auth-foot a{ font-weight:700; color:var(--accent); }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-brand"><div class="brand-mark">R</div><span>Recorda</span></a>
    <div class="card card-pad">
      <h1>Welcome back</h1>
      <p class="sub">Log in to your business records.</p>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="field">
          <label for="id">Email</label>
          <input type="email" id="id" placeholder="you@business.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="pw">Password</label>
          <input type="password" id="pw" placeholder="••••••••" required>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">Log in</button>
      </form>

      <div class="divider-or">or</div>
      <button class="btn btn-secondary btn-block" type="button" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.07 5.07 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.26 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.85A11 11 0 0012 23z"/><path fill="#FBBC05" d="M5.84 14.09a6.6 6.6 0 010-4.19V7.05H2.18a11 11 0 000 9.9l3.66-2.86z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1a11 11 0 00-9.82 6.05l3.66 2.85C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
        Continue with Google
      </button>
    </div>
    <div class="auth-foot">Don't have an account? <a href="register.html">Create one</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>Recorda.auth.redirectIfSignedIn();</script>
<script>
async function handleLogin(e){
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Logging in…';
  try {
    await Recorda.auth.signIn(document.getElementById('id').value.trim(), document.getElementById('pw').value);
    location.href = 'dashboard.html';
  } catch (err) {
    showToast(err.message.includes('Email not confirmed') ? 'Please confirm your email first, then log in.' : err.message);
    btn.disabled = false; btn.textContent = 'Log in';
  }
}
async function handleGoogle(){
  try { await Recorda.auth.signInWithGoogle(); } catch (err) { showToast(err.message); }
}
</script>
</body>
</html>
