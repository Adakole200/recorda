<script>Recorda.auth.requireAuth().catch(()=>{});</script>
<script>
async function markAllRead(){
  try { await Recorda.notifications.markAllRead(); } catch (err) { showToast(err.message); return; }
  document.querySelectorAll('.notif-row.unread').forEach(r=>r.classList.remove('unread'));
  showToast('All notifications marked as read');
}
</script>
<script>
const NOTIF_STYLE = {
  low_stock: ['var(--amber-tint)', '📦'], overdue: ['var(--red-tint)', '🔴'],
  payment: ['var(--ok-tint)', '🟢'], default: ['var(--blue-tint)', '🔵'],
};
function timeAgo(iso){
  const m = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'Just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? ' hour ago' : ' hours ago');
  const d = Math.floor(h / 24);
  return d === 1 ? 'Yesterday' : d + ' days ago';
}
document.addEventListener('DOMContentLoaded', async () => {
  const box = document.getElementById('notifList');
  try {
    const list = await Recorda.notifications.list();
    if (!list.length) { box.innerHTML = '<p class="text-soft text-sm" style="padding:10px 0;">You\'re all caught up. Alerts like low stock will show here.</p>'; return; }
    box.innerHTML = list.map(n => {
      const [bg, icon] = NOTIF_STYLE[n.type] || NOTIF_STYLE.default;
      return `<div class="notif-row ${n.is_read ? '' : 'unread'}">
        <div class="notif-dot-icon" style="background:${bg};">${icon}</div>
        <div class="notif-body"><div class="notif-text">${Recorda.util.esc(n.title)}${n.body ? ' ' + Recorda.util.esc(n.body) : ''}</div><div class="notif-time">${timeAgo(n.created_at)}</div></div>
      </div>`;
    }).join('');
  } catch (err) { showToast(err.message); }
});
</script>
