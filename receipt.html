<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt #RF-00284 — Recorda</title>
<link rel="stylesheet" href="styles.css">
<style>
  body{ background:var(--paper); }
  .receipt-wrap{ max-width:420px; margin:0 auto; padding:30px 20px 60px; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-bottom:18px; }
  .receipt{
    background:#fff; border:1px solid var(--line); border-radius:var(--r-lg);
    padding:28px 26px; box-shadow: var(--shadow-md);
  }
  .r-brand{ text-align:center; margin-bottom:18px; }
  .r-brand-mark{ width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--display);margin:0 auto 10px; }
  .r-biz{ font-weight:800; font-size:16px; letter-spacing:0.02em; }
  .r-addr{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .r-meta{ text-align:center; font-size:12px; color:var(--ink-faint); margin:14px 0 18px; padding-bottom:16px; border-bottom:1px dashed var(--line-strong); }
  .r-items{ margin-bottom:14px; }
  .r-item{ display:flex; justify-content:space-between; font-size:13.5px; padding:6px 0; }
  .r-totals{ border-top:1px dashed var(--line-strong); padding-top:12px; margin-top:8px; }
  .r-row{ display:flex; justify-content:space-between; font-size:13.5px; padding:4px 0; }
  .r-row.final{ font-weight:800; font-size:15px; }
  .r-row.balance{ color:var(--amber); font-weight:800; }
  .r-thanks{ text-align:center; font-size:12px; color:var(--ink-faint); margin-top:20px; }
  .receipt-actions{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:20px; }
  @media (max-width:480px){ .receipt-actions{ grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<div class="receipt-wrap">
  <a href="dashboard.html" class="back-link"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m0 0l6-6m-6 6l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a>

  <div class="receipt">
    <div class="r-brand">
      <div class="r-brand-mark">A</div>
      <div class="r-biz">ADASH FASHION</div>
      <div class="r-addr">Kaduna, Nigeria</div>
    </div>
    <div class="r-meta">Receipt #RF-00284 · 24 August 2026</div>
    <div class="r-items">
      <div class="r-item"><span>2 × Native Shirt</span><span class="num">₦40,000</span></div>
      <div class="r-item"><span>1 × Trouser</span><span class="num">₦15,000</span></div>
    </div>
    <div class="r-totals">
      <div class="r-row final"><span>Subtotal</span><span class="num">₦55,000</span></div>
      <div class="r-row"><span>Paid</span><span class="num">₦45,000</span></div>
      <div class="r-row balance"><span>Balance</span><span class="num">₦10,000</span></div>
    </div>
    <div class="r-thanks">Thank you for your business.</div>
  </div>

  <div class="receipt-actions">
    <button class="btn btn-secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v13m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Download
    </button>
    <button class="btn btn-secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 9V4h12v5M6 18h12v4H6v-4zM6 14h12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="2" y="9" width="20" height="8" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg>
      Print
    </button>
    <button class="btn btn-secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12a1 1 0 011-1h4l3-3v12l-3-3H5a1 1 0 01-1-1v-4z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      Share
    </button>
    <button class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M17.5 3.5a4 4 0 11-3 6.6L8 14a4 4 0 11-1.4-2.6l6.5-3.9a4 4 0 013.4-3.6z" stroke="currentColor" stroke-width="1.6"/></svg>
      WhatsApp
    </button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>Recorda.auth.requireAuth().catch(()=>{});</script>
</body>
</html>
