<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="brand/icon.svg">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E3FAE">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Record Type — Recorda</title>
<link rel="stylesheet" href="styles.css">
<style>
  .form-page{ max-width:620px; margin:0 auto; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-bottom:16px; }
  .field-row{
    display:flex; align-items:center; gap:10px; padding:12px; border:1px solid var(--line);
    border-radius:var(--r-md); margin-bottom:9px; background:var(--paper-raised);
  }
  .drag-handle{ color:var(--ink-faint); cursor:grab; flex-shrink:0; }
  .drag-handle svg{ width:16px;height:16px; }
  .field-row{ flex-wrap:wrap; }
  .field-row input[type=text]{ flex:1; min-height:38px; padding:8px 10px; }
  .field-row select{ width:140px; min-height:38px; padding:8px 10px; flex-shrink:0; }
  .field-remove{ width:32px;height:32px;border-radius:8px; color:var(--ink-faint); display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .field-remove:hover{ background:var(--red-tint); color:var(--red); }
  .type-badge{ font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px; background:var(--line); color:var(--ink-soft); flex-shrink:0; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><img src="brand/logo.svg" alt="Recorda" class="brand-logo"></a>
    <nav class="nav-group">
      <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Dashboard</a>
      <a href="transactions.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V5m6 14v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Transactions</a>
      <a href="customers.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 20a6 6 0 0112 0M17 5.5a3.5 3.5 0 010 7M21 20a6 6 0 00-6.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Customers</a>
      <a href="products.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9h8M8 13h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Products</a>
      <a href="expenses.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Expenses</a>
      <a href="debts.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 4h.01M10.3 2.9L1.8 17a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 2.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Debts</a>
      <a href="reports.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M6 2h9l3 3v17H6V2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 10h6M9 14h6M9 18h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Reports</a>
      <a href="records.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 012-2h8l6 6v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 4v6h6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Records</a>
    </nav>
    <div class="nav-divider"></div>
    <nav class="nav-group"><a href="settings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>Settings</a></nav>
  </aside>

  <div class="main-col">
    <div class="page">
      <div class="form-page">
        <a href="records.html" class="back-link"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m0 0l6-6m-6 6l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>My Records</a>

        <div id="createForm">
          <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">What do you want to keep track of?</h1>
          <p class="text-soft" style="margin-bottom:22px;">Create your own record type with fields that fit your business.</p>

          <div class="card card-pad mb-4">
            <div class="field"><label>Name</label><input type="text" id="typeName" placeholder="e.g. Vehicles" value="Vehicles"></div>
            <div class="field" style="margin-bottom:0;"><label>Description <span class="hint">(optional)</span></label><input type="text" id="typeDesc" placeholder="e.g. Vehicles used for deliveries"></div>
          </div>

          <div class="card card-pad">
            <div class="section-title" style="margin-bottom:12px;"><h2>Fields</h2></div>
            <div id="fieldList">
              <!-- fields injected by JS -->
            </div>
            <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="addField()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Add field
            </button>
          </div>

          <button class="btn btn-primary btn-block mt-4" onclick="createType()">Create Record Type</button>
        </div>

        <div class="hidden" id="createSuccess">
          <div class="card card-pad success-panel">
            <div class="success-check"><svg class="check-draw" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <h3 style="font-size:18px;font-weight:800;">Record type created ✓</h3>
            <p class="text-soft text-sm mt-2" id="createdMsg">"Vehicles" is ready. Start adding entries whenever you like.</p>
          </div>
          <div class="flex gap-3 mt-4">
            <button class="btn btn-secondary btn-block" onclick="location.href='records.html'">Back to Records</button>
            <button class="btn btn-primary btn-block" onclick="location.href='custom-record-list.html?id=' + sessionStorage.getItem('recorda.lastType')">Add first entry</button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>Recorda.auth.requireAuth().catch(()=>{});</script>
<script>
  let fieldCount = 0;
  const fieldTypes = ['Text','Number','Currency','Date','Dropdown','Checkbox','Phone','Email','Long Text'];

  function fieldRowHTML(name, type){
    fieldCount++;
    const opts = fieldTypes.map(t => `<option ${t===type?'selected':''}>${t}</option>`).join('');
    return `
      <div class="field-row" data-id="${fieldCount}">
        <div class="drag-handle"><svg viewBox="0 0 24 24" fill="none"><circle cx="8" cy="6" r="1.4" fill="currentColor"/><circle cx="8" cy="12" r="1.4" fill="currentColor"/><circle cx="8" cy="18" r="1.4" fill="currentColor"/><circle cx="16" cy="6" r="1.4" fill="currentColor"/><circle cx="16" cy="12" r="1.4" fill="currentColor"/><circle cx="16" cy="18" r="1.4" fill="currentColor"/></svg></div>
        <input type="text" value="${name}" placeholder="Field name">
        <select onchange="this.closest('.field-row').querySelector('.opt-input').style.display = this.value === 'Dropdown' ? 'block' : 'none'">${opts}</select>
        <input type="text" class="opt-input" placeholder="Dropdown options, separated by commas (e.g. Active, Maintenance, Retired)" style="display:${type === 'Dropdown' ? 'block' : 'none'}; flex:1 1 100%; order:9;">
        <button type="button" class="field-remove" onclick="this.closest('.field-row').remove()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M7 7l10 10M7 17L17 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>`;
  }

  function addField(name='', type='Text'){
    document.getElementById('fieldList').insertAdjacentHTML('beforeend', fieldRowHTML(name, type));
  }

  // seed with the example from the brief: Vehicle Name, Plate Number, Driver, Purchase Date, Status
  addField('Vehicle Name','Text');
  addField('Plate Number','Text');
  addField('Driver','Text');
  addField('Purchase Date','Date');
  addField('Status','Dropdown');

  async function createType(){
    const name = document.getElementById('typeName').value.trim();
    if (!name) { showToast('Give your record type a name'); return; }
    const fields = [...document.querySelectorAll('#fieldList .field-row')]
      .map(r => ({ label: r.querySelector('input').value.trim(), type: r.querySelector('select').value, options: (r.querySelector('.opt-input')?.value || '').split(',').map(x => x.trim()).filter(Boolean) }))
      .filter(f => f.label);
    if (!fields.length) { showToast('Add at least one field'); return; }
    try {
      const rt = await Recorda.records.createType({ name, description: document.getElementById('typeDesc').value.trim() || null, fields });
      sessionStorage.setItem('recorda.lastType', rt.id);
    } catch (err) { showToast(err.message); return; }
    showTypeCreated(name);
  }
  function showTypeCreated(name){
    document.getElementById('createForm').classList.add('hidden');
    document.getElementById('createSuccess').classList.remove('hidden');
    document.getElementById('createdMsg').textContent = `"${name}" is ready. Start adding entries whenever you like.`;
    window.scrollTo(0,0);
  }
</script>
</body>
</html>
