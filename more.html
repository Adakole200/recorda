<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>More — Recorda</title>
<link rel="stylesheet" href="styles.css">
<style>
  .more-list{ display:flex; flex-direction:column; }
  .more-row{
    display:flex; align-items:center; gap:14px; padding:15px 4px; border-bottom:1px solid var(--line);
  }
  .more-row:last-child{ border-bottom:none; }
  .more-icon{ width:38px;height:38px;border-radius:10px; background:var(--paper); display:flex;align-items:center;justify-content:center; flex-shrink:0; }
  .more-icon svg{ width:18px;height:18px; color:var(--ink-soft); }
  .more-title{ font-weight:700; font-size:14.5px; flex:1; }
  .more-row svg.chev{ width:16px;height:16px; color:var(--ink-faint); }
  .profile-strip{ display:flex; align-items:center; gap:12px; padding:6px 4px 20px; }
  .profile-strip .avatar-sm{ width:44px;height:44px; font-size:15px; }
</style>
</head>
<body>
<div class="app-shell">
  <div class="main-col" style="width:100%;">
    <div class="page">
      <div class="page-head"><div><h1>More</h1></div></div>

      <div class="profile-strip">
        <div class="avatar-sm">JE</div>
        <div>
          <div style="font-weight:800; font-size:15px;">Joseph Emmanuel</div>
          <div class="text-soft text-sm">Adash Fashion</div>
        </div>
      </div>

      <div class="card card-pad more-list">
        <a href="expenses.html" class="more-row">
          <div class="more-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></div>
          <div class="more-title">Expenses</div>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a href="debts.html" class="more-row">
          <div class="more-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 4h.01M10.3 2.9L1.8 17a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 2.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="more-title">Debts</div>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a href="products.html" class="more-row">
          <div class="more-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
          <div class="more-title">Products</div>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a href="reports.html" class="more-row">
          <div class="more-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 2h9l3 3v17H6V2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
          <div class="more-title">Reports</div>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a href="records.html" class="more-row">
          <div class="more-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 012-2h8l6 6v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></div>
          <div class="more-title">My Records</div>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a href="notifications.html" class="more-row">
          <div class="more-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="more-title">Notifications</div>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a href="settings.html" class="more-row">
          <div class="more-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg></div>
          <div class="more-title">Settings</div>
          <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a href="login.html" class="more-row" onclick="Recorda.auth.signOut(); return false;">
          <div class="more-icon" style="background:var(--red-tint);"><svg viewBox="0 0 24 24" fill="none" style="color:var(--red);"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="more-title" style="color:var(--red);">Log out</div>
        </a>
      </div>

    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Home</a>
  <a href="transactions.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V5m6 14v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Activity</a>
  <button class="bn-fab" onclick="location.href='transactions.html'"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></button>
  <a href="customers.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 20a6 6 0 0112 0" stroke="currentColor" stroke-width="1.8"/></svg>Customers</a>
  <a href="more.html" class="bn-item active"><svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>More</a>
</nav>
<div class="desktop-notice" style="display:none; max-width:480px; margin:60px auto; text-align:center; padding:24px; color:var(--ink-soft); font-size:14px;">
  This menu is for the mobile bottom navigation. On desktop, these links live in the sidebar.
</div>
<style>
  @media (min-width:901px){ .app-shell{ display:none; } .bottom-nav{ display:none; } .desktop-notice{ display:block !important; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>Recorda.auth.requireAuth().catch(()=>{});</script>
</body>
</html>
