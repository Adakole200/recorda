<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>Recorda.auth.requireAuth().catch(()=>{});</script>
<script>

const N = n => Recorda.util.naira(n);
const E = Recorda.util.esc;
const tid = new URLSearchParams(location.search).get('id');
let rtype = null, entries = [], editingId = null;

function cell(f, v) {
  if (v === undefined || v === null || v === '') return '—';
  switch (f.type) {
    case 'Date': return Recorda.util.prettyDate(v);
    case 'Currency': return '<span class="num">' + N(v) + '</span>';
    case 'Checkbox': return v === true || v === 'true' ? '✓' : '—';
    case 'Dropdown': return `<span class="badge badge-neutral">${E(v)}</span>`;
    default: return E(v);
  }
}
async function loadType() {
  if (!tid) { document.getElementById('crTitle').textContent = 'No record type selected'; return; }
  try { [rtype, entries] = await Promise.all([Recorda.records.getType(tid), Recorda.records.entries(tid)]); }
  catch (err) { showToast(err.message); return; }
  document.getElementById('crTitle').textContent = rtype.name;
  document.getElementById('crSub').textContent = `Custom record type · ${rtype.fields.length} fields` + (rtype.description ? ' · ' + rtype.description : '');
  document.getElementById('crHead').innerHTML = '<tr>' + rtype.fields.map(f => `<th>${E(f.label)}</th>`).join('') + '<th></th></tr>';
  document.getElementById('crBody').innerHTML = entries.length ? entries.map(en => `<tr>` +
    rtype.fields.map((f, i) => `<td class="${i === 0 ? 'cell-primary' : ''}">${cell(f, en.data[f.key])}</td>`).join('') +
    `<td style="white-space:nowrap;text-align:right;"><button class="btn btn-ghost btn-sm" onclick="openEntry('${en.id}')">Edit</button><button class="btn btn-ghost btn-sm" style="color:var(--red);" onclick="deleteEntry('${en.id}')">Delete</button></td></tr>`).join('')
    : `<tr><td colspan="${rtype.fields.length + 1}" class="text-soft" style="text-align:center;padding:28px;">No entries yet. Tap Add Entry.</td></tr>`;
}
function fieldInput(f, v) {
  const id = 'f_' + f.key;
  const val = v === undefined || v === null ? '' : v;
  let input;
  switch (f.type) {
    case 'Number': case 'Currency': input = `<input type="number" id="${id}" value="${E(val)}" placeholder="${f.type === 'Currency' ? '₦0.00' : '0'}">`; break;
    case 'Date': input = `<input type="date" id="${id}" value="${E(val)}">`; break;
    case 'Phone': input = `<input type="tel" id="${id}" value="${E(val)}">`; break;
    case 'Email': input = `<input type="email" id="${id}" value="${E(val)}">`; break;
    case 'Long Text': input = `<textarea id="${id}">${E(val)}</textarea>`; break;
    case 'Checkbox': input = `<input type="checkbox" id="${id}" ${val === true || val === 'true' ? 'checked' : ''} style="width:auto;min-height:0;">`; break;
    case 'Dropdown': input = `<select id="${id}"><option value="">Select…</option>${(f.options || []).map(o => `<option ${o === val ? 'selected' : ''}>${E(o)}</option>`).join('')}</select>`; break;
    default: input = `<input type="text" id="${id}" value="${E(val)}">`;
  }
  return `<div class="field"><label>${E(f.label)}</label>${input}</div>`;
}
function openEntry(entryId) {
  editingId = entryId || null;
  const en = entryId ? entries.find(x => x.id === entryId) : null;
  document.getElementById('entryTitle').textContent = (en ? 'Edit ' : 'Add ') + rtype.name;
  document.getElementById('entryFields').innerHTML = rtype.fields.map(f => fieldInput(f, en?.data[f.key])).join('');
  openOverlay('entryOverlay');
}
async function saveEntry() {
  const data = {};
  rtype.fields.forEach(f => {
    const el = document.getElementById('f_' + f.key);
    if (f.type === 'Checkbox') data[f.key] = el.checked;
    else if (el.value !== '') data[f.key] = (f.type === 'Number' || f.type === 'Currency') ? Number(el.value) : el.value.trim();
  });
  if (!Object.keys(data).length) { showToast('Fill in at least one field'); return; }
  const btn = document.getElementById('entryBtn'); btn.disabled = true;
  try {
    if (editingId) await Recorda.records.updateEntry(editingId, data); else await Recorda.records.addEntry(tid, data);
    closeOverlay('entryOverlay'); showToast('Saved ✓'); await loadType();
  } catch (err) { showToast(err.message); }
  btn.disabled = false;
}
async function deleteEntry(id) {
  if (!confirm('Delete this entry?')) return;
  try { await Recorda.records.removeEntry(id); await loadType(); } catch (err) { showToast(err.message); }
}
async function deleteType() {
  if (!confirm(`Delete "${rtype.name}" and all ${entries.length} entries? This cannot be undone.`)) return;
  try { await Recorda.records.removeType(tid); location.href = 'records.html'; } catch (err) { showToast(err.message); }
}
document.addEventListener('DOMContentLoaded', loadType);

</script>
