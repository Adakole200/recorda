<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="brand/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="brand/icon.svg">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E3FAE">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — Recorda</title>
<link rel="stylesheet" href="styles.css">
<style>
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card{ width:100%; max-width:400px; }
  .auth-brand{ display:flex; align-items:center; gap:9px; justify-content:center; margin-bottom:28px; }
  .auth-brand .brand-mark{ width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--display); }
  .auth-brand span{ font-weight:800; font-size:19px; }
  .auth-card h1{ font-size:21px; font-weight:800; text-align:center; margin-bottom:6px; }
  .auth-card p.sub{ text-align:center; color:var(--ink-soft); font-size:14px; margin-bottom:26px; }
  .divider-or{ display:flex; align-items:center; gap:12px; margin:18px 0; color:var(--ink-faint); font-size:12.5px; font-weight:600; }
  .divider-or::before, .divider-or::after{ content:""; flex:1; height:1px; background:var(--line); }
  .forgot-link{ font-size:13px; font-weight:700; color:var(--accent); align-self:flex-end; margin-top:-8px; }
  .auth-foot{ text-align:center; margin-top:22px; font-size:14px; color:var(--ink-soft); }
  .auth-foot a{ font-weight:700; color:var(--accent); }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="auth-brand"><img src="brand/logo.svg" alt="Recorda" class="brand-logo"></a>
    <div class="card card-pad">
      <h1>Set a new password</h1>
      <p class="sub" id="rpSub">Choose a new password for your account.</p>
      <form id="resetForm" onsubmit="doReset(event)">
        <div class="field"><label for="pw1">New password</label><input type="password" id="pw1" placeholder="At least 6 characters" autocomplete="new-password" required></div>
        <div class="field"><label for="pw2">Confirm password</label><input type="password" id="pw2" placeholder="Repeat password" autocomplete="new-password" required></div>
        <button type="submit" id="rpBtn" class="btn btn-primary btn-block">Update password</button>
      </form>
    </div>
    <div class="auth-foot"><a href="login.html">Back to log in</a></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>

async function doReset(e){
  e.preventDefault();
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
  if (a.length < 6) { showToast('Password must be at least 6 characters'); return; }
  if (a !== b) { showToast('Passwords do not match'); return; }
  const { data: { session } } = await Recorda.sb.auth.getSession();
  if (!session) { showToast('This reset link has expired. Request a new one from the login page.'); return; }
  const btn = document.getElementById('rpBtn'); btn.disabled = true; btn.textContent = 'Updating…';
  try { await Recorda.auth.updatePassword(a); showToast('Password updated ✓'); setTimeout(() => location.href = 'dashboard.html', 900); }
  catch (err) { showToast(err.message); btn.disabled = false; btn.textContent = 'Update password'; }
}

</script>
</body>
</html>
