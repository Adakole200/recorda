<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses — Recorda</title>
<link rel="stylesheet" href="styles.css">
<style>
  .exp-total{ padding:20px; }
  .cat-row{ display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line); }
  .cat-row:last-child{ border-bottom:none; }
  .cat-name{ width:110px; font-weight:700; font-size:13.5px; flex-shrink:0; }
  .cat-bar-track{ flex:1; height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
  .cat-bar-fill{ height:100%; background:var(--accent); border-radius:99px; }
  .cat-amount{ width:90px; text-align:right; font-weight:800; font-size:13.5px; flex-shrink:0; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><div class="brand-mark">R</div><div class="brand-name">Recorda</div></a>
    <nav class="nav-group">
      <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Dashboard</a>
      <a href="transactions.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V5m6 14v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Transactions</a>
      <a href="customers.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 20a6 6 0 0112 0M17 5.5a3.5 3.5 0 010 7M21 20a6 6 0 00-6.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Customers</a>
      <a href="products.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9h8M8 13h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Products</a>
      <a href="expenses.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Expenses</a>
      <a href="debts.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 4h.01M10.3 2.9L1.8 17a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 2.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Debts</a>
      <a href="reports.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M6 2h9l3 3v17H6V2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 10h6M9 14h6M9 18h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Reports</a>
      <a href="records.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 012-2h8l6 6v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 4v6h6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Records</a>
    </nav>
    <div class="nav-divider"></div>
    <nav class="nav-group"><a href="settings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>Settings</a></nav>
  </aside>

  <div class="main-col">
    <div class="page">
      <div class="page-head">
        <div><h1>Expenses</h1><div class="sub">See where your money goes.</div></div>
        <button class="btn btn-primary" onclick="location.href='new-expense.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Record Expense
        </button>
      </div>

      <div class="toolbar">
        <div class="period-tabs" style="background:var(--paper-raised); border:1px solid var(--line);">
          <button class="period-tab active">Month</button>
          <button class="period-tab">Week</button>
          <button class="period-tab">Year</button>
        </div>
      </div>

      <div class="card exp-total mb-4">
        <div class="stat-label">Total expenses this month</div>
        <div class="ledger-figure"><div class="stat-value num" style="font-size:30px;">₦125,000</div></div>
      </div>

      <div class="card card-pad">
        <div class="section-title" style="margin-bottom:4px;"><h2>By category</h2></div>
        <div class="cat-row">
          <div class="cat-name">Supplies</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:36%;"></div></div>
          <div class="cat-amount num">₦45,000</div>
        </div>
        <div class="cat-row">
          <div class="cat-name">Transport</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:20%;"></div></div>
          <div class="cat-amount num">₦25,000</div>
        </div>
        <div class="cat-row">
          <div class="cat-name">Rent</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:16%;"></div></div>
          <div class="cat-amount num">₦20,000</div>
        </div>
        <div class="cat-row">
          <div class="cat-name">Electricity</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:12%;"></div></div>
          <div class="cat-amount num">₦15,000</div>
        </div>
        <div class="cat-row">
          <div class="cat-name">Other</div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:16%;"></div></div>
          <div class="cat-amount num">₦20,000</div>
        </div>
      </div>

    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Home</a>
  <a href="transactions.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V5m6 14v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Activity</a>
  <button class="bn-fab" onclick="location.href='new-expense.html'"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></button>
  <a href="customers.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 20a6 6 0 0112 0" stroke="currentColor" stroke-width="1.8"/></svg>Customers</a>
  <a href="more.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>More</a>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>Recorda.auth.requireAuth().catch(()=>{});</script>
</body>
</html>
