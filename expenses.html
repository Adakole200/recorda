<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js"></script>
<script>Recorda.auth.requireAuth().catch(()=>{});</script>
<script>

const N = n => Recorda.util.naira(n);
const E = Recorda.util.esc;
let expPeriod = 'month';
const isoLocal = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
function periodRange(p) {
  const now = new Date(), to = isoLocal(now);
  if (p === 'week') { const d = new Date(now); d.setDate(now.getDate() - 6); return [isoLocal(d), to]; }
  if (p === 'year') return [isoLocal(new Date(now.getFullYear(), 0, 1)), to];
  return [isoLocal(new Date(now.getFullYear(), now.getMonth(), 1)), to];
}
function setExpPeriod(p, btn) {
  expPeriod = p;
  document.querySelectorAll('.period-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadExpenses();
}
async function loadExpenses() {
  const [from, to] = periodRange(expPeriod);
  let rows = [];
  try { rows = await Recorda.expenses.list(from, to); } catch (err) { showToast(err.message); }
  const total = rows.reduce((t, r) => t + Number(r.amount), 0);
  document.getElementById('expLabel').textContent = 'Total expenses this ' + expPeriod;
  document.getElementById('expTotal').textContent = N(total);
  const byCat = {};
  rows.forEach(r => { const c = r.category || 'Other'; byCat[c] = (byCat[c] || 0) + Number(r.amount); });
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  document.getElementById('expCats').innerHTML = cats.length ? cats.map(([c, v]) => `
    <div class="cat-row"><div class="cat-name">${E(c)}</div>
      <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.max(3, v / total * 100)}%;"></div></div>
      <div class="cat-amount num">${N(v)}</div></div>`).join('') : '<p class="text-soft text-sm" style="padding:12px 0;">No expenses in this period.</p>';
  document.getElementById('expList').innerHTML = rows.length ? rows.map(r => `
    <div class="activity-row" style="cursor:pointer;" onclick="location.href='transaction-detail.html?kind=expense&id=${r.id}'">
      <div class="act-body"><div class="act-title">${E(r.description || r.category || 'Expense')}</div><div class="act-sub">${E(r.category || 'Other')} · ${Recorda.util.prettyDate(r.expense_date)}${r.payment_method ? ' · ' + E(r.payment_method) : ''}</div></div>
      <div class="act-amount minus num">-${N(r.amount)}</div></div>`).join('') : '<p class="text-soft text-sm" style="padding:12px 0;">Nothing recorded yet.</p>';
}
document.addEventListener('DOMContentLoaded', loadExpenses);

</script>
