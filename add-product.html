<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product — Recorda</title>
<link rel="stylesheet" href="styles.css">
<style>
  .form-page{ max-width:560px; margin:0 auto; }
  .back-link{ display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--ink-soft); margin-bottom:16px; }
  .img-upload{
    border:1.5px dashed var(--line-strong); border-radius:var(--r-md);
    padding:24px; text-align:center; color:var(--ink-faint); font-size:13.5px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .img-upload svg{ width:26px;height:26px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><div class="brand-mark">R</div><div class="brand-name">Recorda</div></a>
    <nav class="nav-group">
      <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Dashboard</a>
      <a href="transactions.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V5m6 14v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Transactions</a>
      <a href="customers.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 20a6 6 0 0112 0M17 5.5a3.5 3.5 0 010 7M21 20a6 6 0 00-6.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Customers</a>
      <a href="products.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9h8M8 13h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Products</a>
      <a href="expenses.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Expenses</a>
      <a href="debts.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 4h.01M10.3 2.9L1.8 17a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 2.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Debts</a>
      <a href="reports.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M6 2h9l3 3v17H6V2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 10h6M9 14h6M9 18h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Reports</a>
      <a href="records.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 012-2h8l6 6v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 4v6h6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Records</a>
    </nav>
    <div class="nav-divider"></div>
    <nav class="nav-group"><a href="settings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>Settings</a></nav>
  </aside>

  <div class="main-col">
    <div class="page">
      <div class="form-page">
        <a href="products.html" class="back-link"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M19 12H5m0 0l6-6m-6 6l6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Products</a>
        <h1 style="font-size:22px;font-weight:800;margin-bottom:4px;">Add Product</h1>
        <p class="text-soft" style="margin-bottom:22px;">Add a new product to your inventory.</p>

        <div id="productForm" class="card card-pad">
          <div class="field"><label>Product image <span class="hint">(optional)</span></label>
            <input type="file" id="pimg" accept="image/*" hidden onchange="document.getElementById('pimgLabel').textContent = this.files[0] ? this.files[0].name : 'Tap to upload a photo'">
            <div class="img-upload" onclick="document.getElementById('pimg').click()" style="cursor:pointer;">
              <svg viewBox="0 0 24 24" fill="none"><path d="M4 16l4-4a3 3 0 014 0l4 4M14 12l1-1a3 3 0 014 0l1 1M4 8h16M4 4h16v16H4V4z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              <span id="pimgLabel">Tap to upload a photo</span>
            </div>
          </div>
          <div class="field"><label>Product name</label><input type="text" id="pname" placeholder="e.g. Native Shirt"></div>
          <div class="field"><label>Category</label>
            <select id="pcat"><option>Fashion</option><option>Retail</option><option>Food</option><option>Other</option></select>
          </div>
          <div class="grid-2">
            <div class="field"><label>Buying price</label><input type="number" id="pbuy" placeholder="₦0.00"></div>
            <div class="field"><label>Selling price</label><input type="number" id="psell" placeholder="₦0.00"></div>
          </div>
          <div class="grid-2">
            <div class="field"><label>Quantity</label><input type="number" id="pqty" placeholder="0"></div>
            <div class="field"><label>Low-stock threshold</label><input type="number" id="plow" placeholder="e.g. 5"></div>
          </div>
          <div class="field"><label>Supplier <span class="hint">(optional)</span></label><input type="text" id="psupplier" placeholder="e.g. Kano Textiles"></div>
        </div>

        <div class="success-panel hidden card card-pad" id="productSuccess">
          <div class="success-check"><svg class="check-draw" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <h3 style="font-size:16px;font-weight:800;">Product saved ✓</h3>
          <p class="text-soft text-sm mt-2">Your product is now in your inventory.</p>
        </div>

        <div class="flex gap-3 mt-4">
          <button class="btn btn-secondary" onclick="location.href='products.html'">Cancel</button>
          <button class="btn btn-primary btn-block" id="saveProductBtn" onclick="saveProduct()">Save Product</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>Recorda.auth.requireAuth().catch(()=>{});</script>
<script>
async function saveProduct(){
  const name = document.getElementById('pname').value.trim();
  if (!name) { showToast('Enter a product name'); return; }
  const btn = document.getElementById('saveProductBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await Recorda.products.add({
      name,
      category: document.getElementById('pcat').value,
      buying_price: Number(document.getElementById('pbuy').value) || 0,
      selling_price: Number(document.getElementById('psell').value) || 0,
      quantity: parseInt(document.getElementById('pqty').value) || 0,
      low_stock_threshold: parseInt(document.getElementById('plow').value) || 5,
      supplier: document.getElementById('psupplier').value.trim() || null,
      imageFile: document.getElementById('pimg').files[0] || null,
    });
  } catch (err) {
    showToast(err.message); btn.disabled = false; btn.textContent = 'Save Product'; return;
  }
  btn.disabled = false;
  showProductSaved();
}
function showProductSaved(){
  document.getElementById('productForm').classList.add('hidden');
  document.getElementById('productSuccess').classList.remove('hidden');
  const btn = document.getElementById('saveProductBtn');
  btn.textContent = 'Go to Products';
  btn.setAttribute('onclick', "location.href='products.html'");
}
</script>
</body>
</html>
