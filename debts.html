<style>

  .debt-info{ flex:1; min-width:180px; }
  .debt-due{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; }
  .debt-amount{ font-weight:800; font-size:16px; margin-right:14px; }
  .debt-actions{ display:flex; gap:8px; }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="dashboard.html" class="brand"><div class="brand-mark">R</div><div class="brand-name">Recorda</div></a>
    <nav class="nav-group">
      <a href="dashboard.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Dashboard</a>
      <a href="transactions.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V5m6 14v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Transactions</a>
      <a href="customers.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 20a6 6 0 0112 0M17 5.5a3.5 3.5 0 010 7M21 20a6 6 0 00-6.5-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Customers</a>
      <a href="products.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 4h16v16H4V4z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8 9h8M8 13h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Products</a>
      <a href="expenses.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Expenses</a>
      <a href="debts.html" class="nav-link active"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5m0 4h.01M10.3 2.9L1.8 17a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 2.9a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Debts</a>
      <a href="reports.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M6 2h9l3 3v17H6V2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 10h6M9 14h6M9 18h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Reports</a>
      <a href="records.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><path d="M4 6a2 2 0 012-2h8l6 6v10a2 2 0 01-2 2H6a2 2 0 01-2-2V6z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 4v6h6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Records</a>
    </nav>
    <div class="nav-divider"></div>
    <nav class="nav-group"><a href="settings.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/></svg>Settings</a></nav>
  </aside>

  <div class="main-col">
    <div class="page">
      <div class="page-head"><div><h1>Debts</h1><div class="sub">Track who owes you, and what you owe.</div></div></div>

      <div class="stat-grid" style="grid-template-columns:repeat(3,1fr);">
        <div class="card stat-card"><div class="stat-label">Money owed to you</div><div class="ledger-figure"><div class="stat-value owed num" id="owedTotal">₦0</div></div></div>
        <div class="card stat-card"><div class="stat-label">You owe others</div><div class="ledger-figure"><div class="stat-value num" id="oweOthers">₦0</div></div></div>
        <div class="card stat-card"><div class="stat-label">Overdue</div><div class="ledger-figure"><div class="stat-value num" style="color:var(--red);" id="overdueTotal">₦0</div></div></div>
      </div>

      <div class="tabs" style="display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;">
        <div class="tab active" style="padding:11px 4px;margin-right:22px;font-weight:700;font-size:14px;color:var(--ink);border-bottom:2px solid var(--accent);">Owed to me</div>
        <div class="tab" style="padding:11px 4px;margin-right:22px;font-weight:700;font-size:14px;color:var(--ink-faint);">I owe</div>
      </div>

      <div id="debtList"></div>

    </div>
  </div>
</div>

<div class="overlay" id="payOverlay">
  <div class="sheet">
    <div class="sheet-head"><h3>Record Payment</h3><button class="close-x" onclick="closeOverlay('payOverlay')">✕</button></div>
    <div class="sheet-body">
      <p class="text-soft text-sm" id="payWho" style="margin-bottom:14px;"></p>
      <div class="field"><label>Amount received</label><input type="number" id="payAmount" placeholder="₦0.00"></div>
      <div class="field"><label>Payment method</label><select id="payMethod"><option>Cash</option><option>Bank Transfer</option><option>POS</option><option>USSD</option></select></div>
      <div class="field"><label>Date</label><input type="date" id="payDate"></div>
    </div>
    <div class="sheet-foot"><button class="btn btn-primary btn-block" id="payBtn" onclick="submitPayment()">Save Payment</button></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="dashboard.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1V10z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>Home</a>
  <a href="transactions.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><path d="M4 19V9m6 10V5m6 14v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Activity</a>
  <button class="bn-fab" onclick="location.href='transactions.html'"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg></button>
  <a href="customers.html" class="bn-item"><svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/><path d="M3 20a6 6 0 0112 0" stroke="currentColor" stroke-width="1.8"/></svg>Customers</a>
  <a href="more.html" class="bn-item active"><svg viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>More</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script>Recorda.auth.requireAuth().catch(()=>{});</script>
<script>
let debtors = [], payingId = null;
const N = n => Recorda.util.naira(n);
async function loadDebts(){
  try { debtors = await Recorda.debts.list(); } catch (err) { showToast(err.message); return; }
  const owed = debtors.reduce((t, d) => t + Number(d.balance), 0);
  const overdue = debtors.filter(d => d.overdue).reduce((t, d) => t + Number(d.balance), 0);
  document.getElementById('owedTotal').textContent = N(owed);
  document.getElementById('overdueTotal').textContent = N(overdue);
  const box = document.getElementById('debtList');
  if (!debtors.length) {
    box.innerHTML = '<div class="card card-pad" style="text-align:center;"><h3 style="font-size:16px;font-weight:800;">No one owes you right now</h3><p class="text-soft text-sm mt-2">Sales recorded on credit will show up here.</p></div>';
    return;
  }
  box.innerHTML = debtors.map((d, i) => {
    const color = d.overdue ? 'var(--red)' : 'var(--amber)';
    const due = d.oldest_due
      ? (d.overdue ? `<div class="debt-due" style="color:var(--red); font-weight:700;">Overdue since ${Recorda.util.prettyDate(d.oldest_due)}</div>`
                   : `<div class="debt-due">Due ${Recorda.util.prettyDate(d.oldest_due)}</div>`)
      : '<div class="debt-due">No due date</div>';
    return `
    <div class="debt-card card">
      <div class="row-flex gap-3" style="flex:1;">
        <div class="avatar-sm" style="${Recorda.util.avatarStyle(i)}">${Recorda.util.esc(Recorda.util.initials(d.name))}</div>
        <div class="debt-info"><div style="font-weight:700;">${Recorda.util.esc(d.name)}</div>${due}</div>
      </div>
      <div class="debt-amount num" style="color:${color};">${N(d.balance)}</div>
      <span class="badge ${d.overdue ? 'badge-red' : 'badge-amber'}" style="margin-right:10px;">${d.overdue ? 'Overdue' : 'Owing'}</span>
      <div class="debt-actions">
        <button class="btn btn-secondary btn-sm" onclick="remind(${i})">Remind</button>
        <button class="btn btn-primary btn-sm" onclick="openPay(${i})">Record Payment</button>
      </div>
    </div>`;
  }).join('');
}
function remind(i){
  const d = debtors[i];
  const msg = `Hello ${d.name}, a friendly reminder of your outstanding balance of ${N(d.balance)}. Thank you!`;
  window.open(Recorda.util.whatsappLink(d.phone, msg), '_blank');
}
function openPay(i){
  const d = debtors[i]; payingId = d.customer_id;
  document.getElementById('payWho').textContent = `${d.name} owes ${N(d.balance)}`;
  document.getElementById('payAmount').value = '';
  document.getElementById('payDate').value = new Date().toISOString().slice(0, 10);
  openOverlay('payOverlay');
}
async function submitPayment(){
  const amount = Number(document.getElementById('payAmount').value);
  if (!(amount > 0)) { showToast('Enter the amount received'); return; }
  const btn = document.getElementById('payBtn'); btn.disabled = true;
  try {
    await Recorda.debts.recordPayment({
      customerId: payingId, amount,
      method: document.getElementById('payMethod').value,
      date: document.getElementById('payDate').value || undefined,
    });
    closeOverlay('payOverlay'); showToast('Payment recorded ✓'); await loadDebts();
  } catch (err) { showToast(err.message); }
  btn.disabled = false;
}
document.addEventListener('DOMContentLoaded', loadDebts);
</script>
</body>
</html>
